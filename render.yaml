# render.yaml - Infrastructure as Code for Render
# Deploy with: render deploy --config render.yaml
# Or connect repo in Render Dashboard and it will auto-detect

services:
  # -----------------------------------------------------------------------------
  # API Service (Fastify + Socket.io)
  # -----------------------------------------------------------------------------
  - type: web
    name: mino-chat-api
    runtime: docker
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: '15m'
      - key: JWT_REFRESH_EXPIRY
        value: '7d'
      - key: JWT_REFRESH_EXPIRY_REMEMBER
        value: '30d'
      - key: REDIS_URL
        fromService:
          type: redis
          name: mino-chat-redis
          property: connectionURL
      - key: CORS_ORIGIN
        value: https://app.mino.chat
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: mino-chat
      - key: S3_REGION
        value: auto
      - key: S3_PUBLIC_URL
        value: https://cdn.mino.chat
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Mino-Chat <noreply@mino.chat>

  # -----------------------------------------------------------------------------
  # Web Service (Static React + Vite build served by Node)
  # -----------------------------------------------------------------------------
  - type: web
    name: mino-chat-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '5173'
      - key: VITE_API_URL
        value: https://api.mino.chat
      - key: VITE_WS_URL
        value: wss://api.mino.chat
      - key: VITE_APP_NAME
        value: Mino-Chat

  # -----------------------------------------------------------------------------
  # Redis (Socket.io adapter, rate limiting, caching)
  # -----------------------------------------------------------------------------
  - type: redis
    name: mino-chat-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru

  # -----------------------------------------------------------------------------
  # Background Worker (for async tasks: email, thumbnails, notifications)
  # -----------------------------------------------------------------------------
  - type: worker
    name: mino-chat-worker
    runtime: docker
    dockerfilePath: ./apps/server/Dockerfile.worker
    dockerContext: .
    plan: starter
    region: frankfurt
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: mino-chat-redis
          property: connectionURL
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: mino-chat
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Mino-Chat <noreply@mino.chat>

databases:
  # Note: Using external Supabase for PostgreSQL
  # This is a placeholder for local development reference
  - name: mino-chat-db
    databaseName: mino_chat
    user: mino_chat
    plan: free
    region: frankfurt
    # Supabase connection details configured via env vars
