version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mino-chat-postgres
    environment:
      POSTGRES_DB: mino_chat
      POSTGRES_USER: mino_chat
      POSTGRES_PASSWORD: mino_chat_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mino_chat -d mino_chat']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: mino-chat-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: mino-chat-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mino-chat-mailhog
    ports:
      - '1025:1025'
      - '8025:8025'

  create-buckets:
    image: minio/mc:latest
    container_name: mino-chat-create-buckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc config host add minio http://minio:9000 minioadmin minioadmin) do echo 'waiting for minio...' && sleep 1; done;
      /usr/bin/mc mb minio/mino-chat --ignore-existing;
      /usr/bin/mc anonymous set public minio/mino-chat/avatars;
      /usr/bin/mc anonymous set public minio/mino-chat/attachments;
      /usr/bin/mc anonymous set public minio/mino-chat/thumbnails;
      echo 'Buckets created successfully';
      "

volumes:
  postgres_data:
  minio_data:
  redis_data:
